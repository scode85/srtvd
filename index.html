<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuẩn hoá phụ đề SRT</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e9ef; --muted:#8b94a7; --accent:#4f8cff; --accent2:#22c55e;
    --warn:#f59e0b; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    min-height:100vh;
  }
  header{ padding:22px 24px 8px; max-width:1400px; margin:0 auto; }
  header h1{ margin:0 0 6px; font-size:22px; letter-spacing:-.3px; }
  header p{ margin:0; color:var(--muted); font-size:13.5px }
  .options{
    max-width:1400px; margin:0 auto; padding:16px 24px 0;
    display:flex; flex-wrap:wrap; gap:14px 26px; align-items:center;
  }
  .opt{ display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text) }
  .opt input[type=checkbox]{
    width:16px;height:16px;accent-color:var(--accent);cursor:pointer;
  }
  .opt input[type=text]{
    width:130px; background:var(--panel2); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:6px 10px; font-size:13.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .opt input[type=text]:disabled{ opacity:.4 }
  main{
    max-width:1400px; margin:0 auto; padding:14px 24px 40px;
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
  }
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    display:flex; flex-direction:column; overflow:hidden; min-height:480px;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border-bottom:1px solid var(--border); background:var(--panel2);
  }
  .panel-head h2{ margin:0; font-size:14px; font-weight:600; letter-spacing:.2px }
  .tools{ display:flex; gap:8px; flex-wrap:wrap }
  button, .filebtn{
    background:#252b36; color:var(--text); border:1px solid var(--border);
    border-radius:9px; padding:7px 12px; font-size:13px; cursor:pointer;
    transition:.15s; font-family:inherit;
  }
  button:hover, .filebtn:hover{ background:#2f3644; border-color:#3b4454 }
  button:active{ transform:translateY(1px) }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600 }
  button.primary:hover{ background:#3d7bf0 }
  button.ghost{ background:transparent }
  .filebtn{ display:inline-flex; align-items:center }
  .filebtn input{ display:none }
  textarea{
    flex:1; width:100%; resize:none; border:0; outline:0; padding:14px;
    background:var(--panel); color:var(--text); font-size:13.5px; line-height:1.55;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:pre; overflow:auto; tab-size:2;
  }
  #output{ background:#141820 }
  textarea::placeholder{ color:#5a6478 }
  .status{
    max-width:1400px; margin:0 auto; padding:0 24px 24px;
    font-size:13px; color:var(--muted); min-height:20px;
  }
  .status b{ color:var(--text); font-weight:600 }
  .status .ok{ color:var(--accent2) }
  .status .warn{ color:var(--warn) }
  .status .err{ color:var(--danger) }
  @media (max-width:900px){
    main{ grid-template-columns:1fr }
    .panel{ min-height:340px }
  }
</style>
</head>
<body>

<header>
  <h1>Chuẩn hoá phụ đề SRT</h1>
  <p>Đánh số lại từ 1 · Dời câu đầu về 00:00:00,000 · Giữ nguyên khoảng cách giữa các câu</p>
</header>

<section class="options">
  <label class="opt">
    <input type="checkbox" id="optNumber" checked>
    Đánh số lại từ 1
  </label>
  <label class="opt">
    <input type="checkbox" id="optShift" checked>
    Dời thời gian — câu đầu bắt đầu tại
  </label>
  <input type="text" id="target" value="00:00:00,000" spellcheck="false">
</section>

<main>
  <section class="panel">
    <div class="panel-head">
      <h2>SRT gốc</h2>
      <div class="tools">
        <label class="filebtn">Mở file<input type="file" id="file" accept=".srt,.txt,.vtt"></label>
        <button class="ghost" id="btnSample">Ví dụ</button>
        <button class="ghost" id="btnClear">Xoá</button>
      </div>
    </div>
    <textarea id="input" spellcheck="false" placeholder="Dán nội dung SRT vào đây...

1001
00:27:45,78 --> 00:27:55,77
Nội dung câu thoại..."></textarea>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>SRT đã xử lý</h2>
      <div class="tools">
        <button id="btnCopy">Sao chép</button>
        <button class="primary" id="btnDownload">Tải .srt</button>
      </div>
    </div>
    <textarea id="output" readonly spellcheck="false" placeholder="Kết quả sẽ hiện ở đây..."></textarea>
  </section>
</main>

<div class="status" id="status"></div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const inputEl   = $("input");
  const outputEl  = $("output");
  const statusEl  = $("status");
  const optNumber = $("optNumber");
  const optShift  = $("optShift");
  const targetEl  = $("target");

  const pad = (n, l = 2) => String(n).padStart(l, "0");

  /* ---------- Regex dòng thời gian ---------- */
  const TIME_RE  = /^\s*(\d{1,3}):(\d{2}):(\d{2})[,.](\d{1,3})\s*-->\s*(\d{1,3}):(\d{2}):(\d{2})[,.](\d{1,3})/;
  const INDEX_RE = /^\s*\d+\s*$/;

  /* ms dạng 1–3 chữ số -> pad phải (78 -> 780) */
  function msPart(v){ return Number((v + "00").slice(0, 3)); }

  function toMs(h, m, s, ms){
    return ((+h) * 3600 + (+m) * 60 + (+s)) * 1000 + msPart(ms);
  }

  function fmt(ms){
    ms = Math.max(0, Math.round(ms));
    const h = Math.floor(ms / 3600000);
    const m = Math.floor(ms / 60000) % 60;
    const s = Math.floor(ms / 1000) % 60;
    const f = ms % 1000;
    return `${pad(h)}:${pad(m)}:${pad(s)},${pad(f, 3)}`;
  }

  /* ---------- Parse SRT ---------- */
  function parseSrt(text){
    const lines = text.replace(/\r\n?/g, "\n").split("\n");
    const cues = [];
    let i = 0;

    const isTime = k => k < lines.length && TIME_RE.test(lines[k]);
    const isIndexBeforeTime = k =>
      k + 1 < lines.length && INDEX_RE.test(lines[k]) && TIME_RE.test(lines[k + 1]);

    while (i < lines.length){
      let index = null;

      if (isIndexBeforeTime(i)) {
        index = lines[i].trim();
        i++;
      }

      const m = lines[i] && lines[i].match(TIME_RE);
      if (!m){
        i++;
        continue;
      }

      const start = toMs(m[1], m[2], m[3], m[4]);
      const end   = toMs(m[5], m[6], m[7], m[8]);
      i++;

      const textLines = [];
      while (
        i < lines.length &&
        lines[i].trim() !== "" &&
        !isTime(i) &&
        !isIndexBeforeTime(i)
      ){
        textLines.push(lines[i]);
        i++;
      }

      cues.push({ index, start, end, text: textLines.join("\n") });
    }
    return cues;
  }

  /* ---------- Parse ô "bắt đầu tại" ---------- */
  function parseTarget(v){
    v = (v || "").trim();
    if (!v) return 0;

    // HH:MM:SS[,mmm]  hoặc  MM:SS[,mmm]
    let m = v.match(/^(?:(\d{1,3}):)?(\d{1,2}):(\d{1,2})(?:[,.](\d{1,3}))?$/);
    if (m){
      const h  = m[1] ? +m[1] : 0;
      const mi = +m[2];
      const s  = +m[3];
      const ms = m[4] ? msPart(m[4]) : 0;
      return (h * 3600 + mi * 60 + s) * 1000 + ms;
    }

    // số giây: "0", "1.5", "12,25"
    const n = parseFloat(v.replace(",", "."));
    if (!isNaN(n)) return Math.round(n * 1000);
    return 0;
  }

  /* ---------- Xử lý ---------- */
  let lastResult = "";

  function build(){
    const raw = inputEl.value;
    if (!raw.trim()){
      outputEl.value = "";
      lastResult = "";
      setStatus("");
      return;
    }

    const cues = parseSrt(raw);
    if (!cues.length){
      outputEl.value = "";
      lastResult = "";
      setStatus('<span class="err">Không tìm thấy dòng thời gian hợp lệ (dạng 00:00:00,000 --&gt; 00:00:00,000).</span>');
      return;
    }

    const minStart = cues.reduce((a, c) => Math.min(a, c.start), Infinity);
    const targetMs = optShift.checked ? parseTarget(targetEl.value) : minStart;
    const shift    = optShift.checked ? (minStart - targetMs) : 0;

    let bad = 0;
    const blocks = cues.map((c, i) => {
      const s = Math.max(0, c.start - shift);
      const e = Math.max(0, c.end   - shift);
      if (e <= s) bad++;

      const num = optNumber.checked ? (i + 1) : (c.index || (i + 1));
      return `${num}\n${fmt(s)} --> ${fmt(e)}\n${c.text}`;
    });

    lastResult = blocks.join("\n\n") + "\n";
    outputEl.value = lastResult;

    const first = cues[0];
    const info = [
      `Đã xử lý <b>${cues.length}</b> câu.`,
      `Câu đầu: <b>${fmt(first.start)}</b> → <b>${fmt(Math.max(0, first.start - shift))}</b>`,
      optShift.checked
        ? `Đã dời sớm <b>${fmt(shift)}</b> — câu đầu bắt đầu tại <b>${fmt(targetMs)}</b>.`
        : `Không dời thời gian.`,
      `<span class="ok">✔ Khoảng cách giữa các câu được giữ nguyên 100%.</span>`
    ];
    if (bad) info.push(`<span class="warn">⚠ ${bad} câu có thời lượng ≤ 0, hãy kiểm tra lại.</span>`);

    setStatus(info.join(" "));
  }

  function setStatus(html){ statusEl.innerHTML = html || ""; }

  /* ---------- Sự kiện ---------- */
  let timer;
  const schedule = () => { clearTimeout(timer); timer = setTimeout(build, 120); };

  inputEl.addEventListener("input", schedule);
  optNumber.addEventListener("change", build);
  optShift.addEventListener("change", () => {
    targetEl.disabled = !optShift.checked;
    build();
  });
  targetEl.addEventListener("input", schedule);

  targetEl.disabled = !optShift.checked;

  /* Mở file */
  $("file").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { inputEl.value = r.result; build(); };
    r.readAsText(f, "utf-8");
    e.target.value = "";
  });

  /* Kéo–thả file vào ô nhập */
  inputEl.addEventListener("dragover", e => e.preventDefault());
  inputEl.addEventListener("drop", e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { inputEl.value = r.result; build(); };
    r.readAsText(f, "utf-8");
  });

  /* Ví dụ */
  $("btnSample").addEventListener("click", () => {
    inputEl.value =
`1001
00:27:12,050 --> 00:27:13,710
Bất kể sau đó đệ ấy có thử bao nhiêu lần đi nữa,

1002
00:27:13,710 --> 00:27:16,590
thì tình hình vẫn y như cũ. Cả một xe đậu hũ giờ chỉ còn lại hai miếng nguyên vẹn.

1003
00:27:16,590 --> 00:27:17,710
Vân Chi cũng không nhìn nổi nữa,

1004
00:27:17,710 --> 00:27:18,770
liền bảo đệ ấy phải tìm đúng cảm giác,

1005
00:27:18,770 --> 00:27:20,610
dùng cơ thể để khống chế sức mạnh chứ không phải dùng linh đài.
`;
    build();
  });

  /* Xoá */
  $("btnClear").addEventListener("click", () => {
    inputEl.value = "";
    outputEl.value = "";
    lastResult = "";
    setStatus("");
    inputEl.focus();
  });

  /* Sao chép */
  $("btnCopy").addEventListener("click", async () => {
    if (!lastResult){ setStatus('<span class="warn">Chưa có kết quả để sao chép.</span>'); return; }
    try {
      await navigator.clipboard.writeText(lastResult);
      setStatus('<span class="ok">✔ Đã sao chép kết quả vào clipboard.</span>');
    } catch {
      outputEl.select();
      document.execCommand("copy");
      setStatus('<span class="ok">✔ Đã sao chép.</span>');
    }
  });

  /* Tải file */
  $("btnDownload").addEventListener("click", () => {
    if (!lastResult){ setStatus('<span class="warn">Chưa có kết quả để tải.</span>'); return; }
    const blob = new Blob(["\uFEFF" + lastResult], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "output.srt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  /* Ctrl+S để tải nhanh */
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){
      e.preventDefault();
      $("btnDownload").click();
    }
  });
})();
</script>
</body>
</html>
